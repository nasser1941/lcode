site_name: lcode
site_description: A local-first terminal coding agent powered by open-weight models on your own GPU or Mac.
site_url: https://nasser1941.github.io/lcode/
repo_url: https://github.com/nasser1941/lcode
repo_name: nasser1941/lcode
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Naser Derakhshan · <a href="https://github.com/nasser1941/lcode/blob/main/LICENSE">MIT License</a>

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nasser1941/lcode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Guide:
      - Using lcode: usage.md
      - Memory: memory.md
      - Subagents: agents.md
      - Commands and skills: commands.md
      - Code intelligence: lsp.md
      - Models & context windows: models.md
      - Benchmarking models: bench.md
      - MCP servers: mcp.md
      - Sandbox: sandbox.md
      - Configuration: configuration.md
  - Reference:
      - How it works: how-it-works.md
      - Troubleshooting & FAQ: troubleshooting.md
  - Project:
      - Contributing: contributing.md
      - Changelog: changelog.md
