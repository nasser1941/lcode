# Ready-made MCP servers: `lcode mcp add <key>` sets one up.
#
# server   the entry written to mcp.json (the standard mcpServers format). ${NAME} refers to an input
#          below or to an environment variable.
# inputs   values lcode asks for when the variable isn't set in the environment. Secrets are typed
#          hidden and saved in mcp.json, which only you can read.
# requires commands that must be installed.
# login    sign in through the browser (OAuth) after adding.
#
# Commands and URLs were checked against each project's documentation in September to November 2026.

[atlassian]
name = "Atlassian"
description = "Jira, Confluence, Bitbucket and Compass"
homepage = "https://github.com/atlassian/atlassian-mcp-server"
login = true
setup = "Sign in with your Atlassian account in the browser."
server = { type = "http", url = "https://mcp.atlassian.com/v2/mcp" }

[aws]
name = "AWS"
description = "Run AWS CLI commands against your account (read-only unless you change it)"
homepage = "https://awslabs.github.io/mcp/servers/aws-api-mcp-server"
requires = ["uvx"]
setup = "Uses your local AWS credentials (aws configure or aws sso login). AWS now recommends its newer server: lcode mcp add aws-mcp. Read-only to start: set READ_OPERATIONS_ONLY to \"false\" in mcp.json to allow changes; lcode still asks before every call."

[aws.server]
command = "uvx"
args = ["--python", "3.12", "awslabs.aws-api-mcp-server@latest"]
env = { AWS_REGION = "${AWS_REGION}", AWS_API_MCP_PROFILE_NAME = "${AWS_PROFILE}", READ_OPERATIONS_ONLY = "true", AWS_API_MCP_TELEMETRY = "false" }

[[aws.inputs]]
var = "AWS_REGION"
prompt = "AWS region"
default = "us-east-1"

[[aws.inputs]]
var = "AWS_PROFILE"
prompt = "AWS profile (from ~/.aws/config)"
default = "default"

[aws-mcp]
name = "AWS MCP Server"
description = "AWS's newer managed server: AWS API calls through Python scripts, documentation and skills (can change things)"
homepage = "https://docs.aws.amazon.com/agent-toolkit/latest/userguide/mcp-server.html"
requires = ["uvx"]
setup = """AWS runs this server; a local proxy signs requests with your AWS credentials (aws configure, aws sso login or
aws login). It can change resources: your IAM permissions decide what it can do, so use a profile with only the access
you want, and lcode asks before every call. Add --read-only to its args in mcp.json to hide the tools that can write.
Add either this or "aws", not both: their tools overlap."""

[aws-mcp.server]
command = "uvx"
# mcp-proxy-for-aws-cli pins all of its dependencies, and signs requests with your credentials (SigV4).
args = [
  "--python", "3.12", "mcp-proxy-for-aws-cli@1.8.0", "https://aws-mcp.us-east-1.api.aws/mcp",
  "--profile", "${AWS_PROFILE}", "--metadata", "AWS_REGION=${AWS_REGION}", "--disable-telemetry",
]

[[aws-mcp.inputs]]
var = "AWS_REGION"
prompt = "AWS region for your resources"
default = "us-east-1"

[[aws-mcp.inputs]]
var = "AWS_PROFILE"
prompt = "AWS profile (from ~/.aws/config)"
default = "default"

[aws-knowledge]
name = "AWS Knowledge"
description = "Up-to-date AWS documentation, code samples and regional availability (no AWS account needed)"
homepage = "https://awslabs.github.io/mcp/servers/aws-knowledge-mcp-server"
server = { type = "http", url = "https://knowledge-mcp.global.api.aws" }

[google-drive]
name = "Google Drive"
description = "Search, read and create files in your Google Drive"
homepage = "https://developers.google.com/workspace/drive/api/guides/configure-mcp-server"
login = true
setup = """Google needs an OAuth client from your own Google Cloud project. For your own account, the quickest way is Google
Cloud's personal mode setup, with a "Desktop app" client. Otherwise:
  1. In a Google Cloud project, enable the Google Drive API and the Google Drive MCP API.
  2. Configure the OAuth consent screen (add yourself as a test user if the app is in testing).
  3. Create an OAuth client ID of type "Desktop app", with "Use this client for an AI-powered agent" selected, and
     copy its client ID and secret.
Guide: https://developers.google.com/workspace/drive/api/guides/configure-mcp-server"""

[google-drive.server]
type = "http"
url = "https://drivemcp.googleapis.com/mcp/v1"

[google-drive.server.oauth]
client_id = "${GOOGLE_OAUTH_CLIENT_ID}"
client_secret = "${GOOGLE_OAUTH_CLIENT_SECRET}"
scopes = ["https://www.googleapis.com/auth/drive.readonly", "https://www.googleapis.com/auth/drive.file"]
authorize_params = { access_type = "offline", prompt = "consent" }

[[google-drive.inputs]]
var = "GOOGLE_OAUTH_CLIENT_ID"
prompt = "OAuth client ID"

[[google-drive.inputs]]
var = "GOOGLE_OAUTH_CLIENT_SECRET"
prompt = "OAuth client secret"
secret = true

[grafana]
name = "Grafana"
description = "Dashboards, Prometheus and Loki queries, alerts and incidents"
homepage = "https://github.com/grafana/mcp-grafana"
requires = ["uvx"]
setup = "Create a service account token in Grafana: Administration > Users and access > Service accounts. Read-only to start: remove --disable-write in mcp.json to let it change dashboards and alert rules. The server has about 80 tools; list the ones you use under \"tools\" in mcp.json to save context."

[grafana.server]
command = "uvx"
args = ["--python", "3.12", "mcp-grafana", "--disable-write"]
env = { GRAFANA_URL = "${GRAFANA_URL}", GRAFANA_SERVICE_ACCOUNT_TOKEN = "${GRAFANA_SERVICE_ACCOUNT_TOKEN}" }

[[grafana.inputs]]
var = "GRAFANA_URL"
prompt = "Grafana URL"
default = "http://localhost:3000"

[[grafana.inputs]]
var = "GRAFANA_SERVICE_ACCOUNT_TOKEN"
prompt = "Service account token"
secret = true

[gcp]
name = "Google Cloud"
description = "Run gcloud commands against your Google Cloud projects"
homepage = "https://github.com/googleapis/gcloud-mcp"
requires = ["npx", "gcloud"]
setup = "Uses the gcloud CLI and its login: install it and run `gcloud auth login` first."
server = { command = "npx", args = ["-y", "@google-cloud/gcloud-mcp"] }

[github]
name = "GitHub"
description = "Repositories, issues, pull requests and Actions"
homepage = "https://github.com/github/github-mcp-server"
setup = "Needs a personal access token: https://github.com/settings/personal-access-tokens/new (or the GitHub CLI's, from `gh auth token`). Only the repos, issues, pull_requests and actions toolsets are on; change X-MCP-Toolsets in mcp.json for more."

[github.server]
type = "http"
url = "https://api.githubcopilot.com/mcp/"
headers = { Authorization = "Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}", X-MCP-Toolsets = "repos,issues,pull_requests,actions" }

[[github.inputs]]
var = "GITHUB_PERSONAL_ACCESS_TOKEN"
prompt = "GitHub token"
secret = true
from_command = ["gh", "auth", "token"]

[playwright]
name = "Playwright"
description = "Drive a real browser: open pages, click, fill forms, take snapshots (for testing web apps)"
homepage = "https://github.com/microsoft/playwright-mcp"
requires = ["npx"]
setup = "Runs a headless browser; the first use may download it."
server = { command = "npx", args = ["-y", "@playwright/mcp@latest", "--headless"] }

[context7]
name = "Context7"
description = "Current documentation and code examples for thousands of libraries"
homepage = "https://github.com/upstash/context7"
setup = "Works without an API key; a free key from https://context7.com/dashboard raises the rate limits."

[context7.server]
type = "http"
url = "https://mcp.context7.com/mcp"
headers = { CONTEXT7_API_KEY = "${CONTEXT7_API_KEY}" }

[[context7.inputs]]
var = "CONTEXT7_API_KEY"
prompt = "API key (optional, press Enter to skip)"
secret = true
optional = true

[sentry]
name = "Sentry"
description = "Errors, issues, traces and releases from your Sentry organization"
homepage = "https://docs.sentry.io/product/sentry-mcp/"
login = true
setup = "Sign in with your Sentry account in the browser."
server = { type = "http", url = "https://mcp.sentry.dev/mcp" }

[postgres]
name = "PostgreSQL"
description = "Explore schemas, run read-only queries and analyze query performance"
homepage = "https://github.com/crystaldba/postgres-mcp"
requires = ["uvx"]
setup = "Read-only (restricted mode): change --access-mode to unrestricted in mcp.json to allow writes."

[postgres.server]
command = "uvx"
# postgres-mcp breaks with version 2 of the MCP Python SDK (September 2026), hence --with "mcp<2".
args = ["--python", "3.12", "--with", "mcp<2", "postgres-mcp", "--access-mode=restricted"]
env = { DATABASE_URI = "${DATABASE_URI}" }

[[postgres.inputs]]
var = "DATABASE_URI"
prompt = "Connection URL (postgresql://user:password@host:5432/database)"
secret = true

[kubernetes]
name = "Kubernetes"
description = "Inspect pods, deployments, logs and events in your clusters (read-only)"
homepage = "https://github.com/containers/kubernetes-mcp-server"
requires = ["npx"]
setup = "Uses your kubeconfig and its current context. Read-only: remove --read-only in mcp.json to allow changes."
server = { command = "npx", args = ["-y", "kubernetes-mcp-server@latest", "--read-only"] }

[linear]
name = "Linear"
description = "Issues, projects and cycles in Linear"
homepage = "https://linear.app/docs/mcp"
login = true
setup = "Sign in with your Linear account in the browser."
server = { type = "http", url = "https://mcp.linear.app/mcp" }

[notion]
name = "Notion"
description = "Search, read and edit Notion pages and databases"
homepage = "https://developers.notion.com/docs/mcp"
login = true
setup = "Sign in with your Notion account in the browser."
server = { type = "http", url = "https://mcp.notion.com/mcp" }

[metabase]
name = "Metabase"
description = "Explore your data and ask questions through Metabase's semantic layer, with your Metabase permissions"
homepage = "https://www.metabase.com/docs/latest/ai/mcp"
login = true
setup = """Needs Metabase 60 or later with its MCP server switched on: an admin turns it on under Admin > AI > MCP.
Sign in with your Metabase account in the browser."""
server = { type = "http", url = "${METABASE_URL}/api/metabase-mcp" }

[[metabase.inputs]]
var = "METABASE_URL"
prompt = "Metabase address, e.g. https://metabase.example.com"

[encord]
name = "Encord"
description = "Projects, datasets, ontologies, labeling progress, tasks and labels (read-only)"
homepage = "https://nasser1941.github.io/lcode/mcp/#encord"
requires = ["uvx"]
setup = """Encord has no MCP server of its own, so this one comes with lcode (it uses the Encord SDK). It signs in with an SSH
key registered in Encord: Settings > Public keys. Read-only: add --allow-writes to its args in mcp.json to let the
model assign tasks and set priorities; lcode still asks before every call."""

[encord.server]
command = "uvx"
# --isolated: otherwise uvx reuses an installed lcode-cli tool, which lacks the encord extra.
args = ["--isolated", "--python", "3.12", "--from", "lcode-cli[encord]", "lcode-mcp-encord"]
env = { ENCORD_SSH_KEY_FILE = "${ENCORD_SSH_KEY_FILE}" }

[[encord.inputs]]
var = "ENCORD_SSH_KEY_FILE"
prompt = "Path to the SSH private key registered in Encord"
default = "~/.ssh/id_ed25519"

[valohai]
name = "Valohai"
description = "ML executions with their logs, metrics and outputs, and pipelines (read-only)"
homepage = "https://nasser1941.github.io/lcode/mcp/#valohai"
requires = ["uvx"]
setup = """Valohai has no MCP server of its own, so this one comes with lcode. It needs an API token: My Profile >
Authentication > Manage tokens. Read-only: add --allow-writes to its args in mcp.json to let the model start and stop
executions; lcode still asks before every call."""

[valohai.server]
command = "uvx"
args = ["--isolated", "--python", "3.12", "--from", "lcode-cli", "lcode-mcp-valohai"]
env = { VALOHAI_TOKEN = "${VALOHAI_TOKEN}", VALOHAI_HOST = "${VALOHAI_HOST}" }

[[valohai.inputs]]
var = "VALOHAI_TOKEN"
prompt = "Valohai API token"
secret = true

[[valohai.inputs]]
var = "VALOHAI_HOST"
prompt = "Valohai address (Enter for app.valohai.com; for a self-hosted installation, its URL)"
optional = true

[rea]
name = "REA"
description = "Reverse engineering: unpack Electron apps and archives, decompile native programs with Ghidra"
homepage = "https://github.com/morluto/rea"
requires = ["npx"]
setup = """Only for software you own or are authorized to examine. Electron apps and archives need only a recent Node.js (22.23.4
or later in its 22 line, or a current 24 or 26). Native programs also need Ghidra 12.2 and a full JDK 25, not just the Java
runtime: give their folders, or press Enter to skip them."""

[rea.server]
command = "npx"
# The version lcode was tested with. No install scripts and no optional packages: frida, for hooking into running
# programs, is one, and lcode doesn't offer the tools that use it.
args = ["-y", "rea-agents@6.10.1", "mcp"]
env = { npm_config_ignore_scripts = "true", npm_config_omit = "optional", NO_UPDATE_NOTIFIER = "1", GHIDRA_INSTALL_DIR = "${GHIDRA_INSTALL_DIR}", JAVA_HOME = "${JAVA_HOME}" }
# All 263 definitions take about 82,000 tokens. These fit in a 32K window and don't launch the target.
tools = [
  "open_binary",
  "extract_artifact",
  "binary_overview",
  "list_procedures",
  "search_strings",
  "trace_feature",
  "xrefs",
  "procedure_callers",
  "procedure_pseudo_code",
  "close_binary",
]

[[rea.inputs]]
var = "GHIDRA_INSTALL_DIR"
prompt = "Ghidra folder, full path (Enter to skip native programs)"
optional = true

[[rea.inputs]]
var = "JAVA_HOME"
prompt = "JDK 25 folder, full path (Enter to use the java on your PATH)"
optional = true
