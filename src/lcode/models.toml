# The model catalog: open-weight models lcode knows how to size and set up.
#
# Want another model? Open a "Model request" issue or a pull request that adds an entry here
# (see CONTRIBUTING.md). Any other Ollama model with tool calling also works with
# `lcode --model <ollama-tag>`; lcode just can't estimate its memory needs.
#
# Fields
#   key               short name used on the command line (`lcode --model <key>`)
#   tag               Ollama model tag that `lcode setup` pulls
#   size_gb           download size (GB, 10^9 bytes)
#   max_context       largest context window the model supports (tokens)
#   kv_kib_per_token  KV-cache memory per token of context at f16 (KiB), computed from the GGUF
#                     metadata: attention layers x KV heads x (key_length + value_length) x 2 bytes
#   kv_estimated      true when the attention layout had to be assumed rather than read
#   moe               Mixture-of-Experts: runs well even when part of it sits in system RAM
#   num_batch         prompt batch size lcode uses by default (omit for Ollama's default of 512)
#   tested            verified end to end with lcode's tools by the maintainers
#
# The order matters: `lcode setup` recommends the first *tested* model that fits the machine, and
# otherwise the first model in this order that fits with a useful context, so keep stronger models first.

[[model]]
key = "qwen3.6-35b"
tag = "qwen3.6:35b-a3b-coding"
name = "Qwen3.6 35B-A3B Coding"
publisher = "Qwen (Alibaba)"
params = "35B MoE · 3B active"
moe = true
size_gb = 22.6
max_context = 262144
kv_kib_per_token = 22
swe_bench_verified = 73.4
tested = true
notes = "Default. Strongest tool calling among local MoE coders; fast even with experts in RAM."

