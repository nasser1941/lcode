# Temporary (removed before merge): how often headless Chrome hangs on start on GitHub's Ubuntu runners.
name: Chrome probe
on:
  push:
    branches: [fix/chrome-flake]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/probe/chrome_probe.py "$(command -v google-chrome)" 120
